databases:
  - name: certificate_validationdb
    plan: free
    databaseName: certificate_validation
    user: certificate_validation

services:
  - type: web
    plan: free
    name: certificate_validation
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "python -m gunicorn certificate_validation.asgi:application -k uvicorn.workers.UvicornWorker"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: certificate_validationdb
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4